body: |-
  今日は東大阪吹奏楽団のはじめての演奏会🥁🎵
  施設ご利用者さんと一緒に声を揃えて歌ったり🎤、みなさん一生懸命手拍子👏してくださったり！

  ただ音楽を届けるだけでなく、なんだかみんなの心が通った…
  そんな演奏会になったんじゃないかなと感じております☺️
  (団員のみんなも、利用者さんもみんなそんなふうに感じてもらえてたのなら、今回の演奏会は大成功だったなと思います！)

  まぁMC噛みっかみやったのと、ふるさとの歌詞を記憶の彼方に吹っ飛ばしちゃったことが心残りかな🤣！

  音楽を通して、地域の人とともに東大阪の音楽を育てる🌱
  音楽を通して、団員のみんなと心を一つにする……🎺
  そういうドラマを一緒に描いていけたらなと想像しながら💭未来予想図を広げるのでした🗺️
