title: チューバ急募！ パートごとの募集状況を更新しました
date: 2026-11-02
category: 募集
cover: img/ph-trombone.webp
status: 公開する
body: |-
  パートごとの募集状況を更新しました。いま、いちばん仲間を探しているのはチューバです。

  ## 募集中のパート

  フルート、オーボエ、ファゴット、クラリネット、バスクラリネット、トランペット、ホルン、トロンボーン、バストロンボーン、チューバ、打楽器で募集しています。

  くわしい人数は[パート紹介と募集状況](about.html#parts)をご覧ください。

  ブランクがある方も大歓迎です。まずは見学で、合奏の音を聴いてみてください。
