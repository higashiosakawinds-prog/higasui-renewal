title: 東大阪市吹奏楽フェスタ、2027年5月2日に開催決定
date: 2026-09-28
category: 演奏会
cover: img/post-festa.webp
status: 公開する
body: |-
  ひがすいが主催する「東大阪市吹奏楽フェスタ」を、2027年5月2日（日）に開催します。

  ## 開催概要

  - 会場：大阪府立中央図書館 ライティホール
  - 入場：無料
  - 出演：日新高校吹奏楽部、吹奏楽団 未来図、東大阪吹奏楽団

  くわしくは[フェスタのサイト](https://higashiosakawinds-prog.github.io/brassfes/)をご覧ください。
