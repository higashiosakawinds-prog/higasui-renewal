# =========================================================
# GitHub Pages がサイトを組み立てるときの設定
# _data/news フォルダの記事を、news.json（記事の一覧）にまとめるために使っています。
# 記事は「データ」として読むので、本文に { } などの記号を書いてもサイトが止まりません。
# =========================================================

timezone: Asia/Tokyo

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: true       # 本文の改行を、そのまま改行として出す

exclude:
  - README.md
  - "*.sql"
