# =========================================================
# ひがすい サイトの管理画面（Pages CMS）の設定
#
# ・label（画面に出る名前）と description（説明）は日本語にしています
# ・記事は _data/news フォルダに 1記事 = 1ファイル で保存されます
# ・写真は img/news フォルダに保存されます
# ・保存すると GitHub Pages が news.json を作り直し、1分ほどでサイトに出ます
# ・あとで入力欄を足すときは、ここと news.json の両方に書き足します
# =========================================================

media:
  - name: news
    label: 写真（お知らせ）
    input: img/news
    output: img/news
    categories: [image]
    rename: random      # 日本語のファイル名でも重ならないように、名前を自動でつける
  - name: events
    label: 写真（演奏会）
    input: img/events
    output: img/events
    categories: [image]
    rename: random

content:
  - name: news
    label: お知らせ・活動日記
    description: サイトの「お知らせ・活動日記」と、トップページの新着に出る記事です。
    type: collection
    path: _data/news
    format: yaml
    filename: "{year}{month}{day}-{hour}{minute}{second}.yml"
    view:
      fields: [title, date, category, status]
      primary: title
      search: [title, body]
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: タイトル
        type: string
        required: true
        description: 一覧とトップページに出ます。30文字くらいまでがおすすめです。

      - name: date
        label: 日付
        type: date
        required: true
        description: 記事に出る日付です。新しい日付のものから順に並びます。

      - name: category
        label: カテゴリ
        type: select
        required: true
        default: お知らせ
        description: 一覧ページの絞り込みに使います。
        options:
          values: [お知らせ, 演奏会, 募集, 練習日記]

      - name: cover
        label: 一覧に出す写真
        type: image
        description: 横長の写真がきれいに見えます。なくても大丈夫です（そのときは練習の写真が入ります）。
        options:
          media: news

      - name: status
        label: 公開
        type: select
        required: true
        default: 公開する
        description: 「下書き」にすると、サイトには出ません（書きかけのときに使います）。
        options:
          values: [公開する, 下書き]

      - name: body
        label: 本文
        type: rich-text
        description: 改行はそのまま改行になります。写真は上の画像ボタンから入れられます。
        options:
          media: news

  # ---------------------------------------------------------
  # 演奏会・イベント（events.html に出る。日付が今日より前になると、自動で「これまで」に移る）
  # ---------------------------------------------------------
  - name: events
    label: 演奏会・イベント
    description: 演奏会・イベントのページに出ます。本番が終わると、自動で「これまで」に移ります。
    type: collection
    path: _data/events
    format: yaml
    filename: "{year}{month}{day}-{hour}{minute}{second}.yml"
    view:
      fields: [title, date, kind, pickup, status]
      primary: title
      search: [title, place, body]
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: 演奏会・イベントの名前
        type: string
        required: true
      - name: kind
        label: 種類
        type: select
        required: true
        default: 出演
        description: 主催演奏会＝ひがすいが開く演奏会。出演＝施設やおまつりなどに呼ばれて演奏するもの。
        options:
          values: [主催演奏会, 出演, ワークショップ, その他]
      - name: date
        label: 日付
        type: date
        required: true
        description: 本番の日です。この日を過ぎると「これまで」に移ります。日にちが未定のときは、仮の日付を入れて、下の「日時の書き方」を使います。
      - name: time
        label: 時間
        type: string
        description: 例：14:30開演、13:00開場 / 13:30開演
      - name: when_text
        label: 日時の書き方（日にちが未定のとき）
        type: string
        description: ここに書くと、日付のかわりにこの文が出ます。例：2026年12月（日時は決まりしだいお知らせします）
      - name: place
        label: 会場
        type: string
        required: true
      - name: place_note
        label: 会場の住所・行き方
        type: text
        description: なくても大丈夫です。例：近鉄奈良線「瓢箪山」駅から徒歩5分
      - name: fee
        label: 入場料
        type: string
        description: 例：入場無料、一般 1,000円 / 高校生以下 無料
      - name: performers
        label: 出演
        type: string
      - name: summary
        label: ひとこと紹介
        type: text
        description: 一覧に出る短い紹介です。60文字くらいまでがおすすめです。
      - name: cover
        label: メインの写真・チラシ
        type: image
        description: 本番前はチラシ、本番のあとは当日の写真がおすすめです。
        options:
          media: events
      - name: photos
        label: 当日の写真
        type: image
        description: 本番のあとに入れると、くわしいページに並びます。何枚でも入れられます。
        options:
          media: events
          multiple: true
      - name: pickup
        label: トップページに大きく出す
        type: boolean
        default: false
        description: トップページの「次の演奏会」には、これからの本番がすべて順番に回って出ます。オンにすると、その中でいちばん先頭に出ます。
      - name: pickup_image
        label: トップページ用の写真（横長）
        type: image
        description: トップの欄は横長なので、たてのチラシだと切れてしまいます。横長の写真を入れておくと、こちらが使われます。
        options:
          media: events
      - name: link_url
        label: 申し込み・特設サイトのURL
        type: string
        description: チケットの申し込みページや特設サイトがあるときに入れます。
      - name: link_label
        label: そのボタンの文字
        type: string
        description: 例：チケットを申し込む、特設サイトを見る
      - name: status
        label: 公開
        type: select
        required: true
        default: 公開する
        options:
          values: [公開する, 下書き]
      - name: body
        label: くわしい内容・ふりかえり
        type: rich-text
        description: 本番前は曲目や見どころ、本番のあとはふりかえりを書きます。
        options:
          media: events

  # ---------------------------------------------------------
  # パートの募集状況（団体紹介の募集ボードと、トップの「いま◯パートで募集中」に出る）
  # ポータルとつなぐことになったら、「いまの人数」はポータルの数字が優先される（about.html の loadParts）
  # ---------------------------------------------------------
  - name: parts
    label: パートの募集状況
    type: file
    path: _data/parts.yml
    format: yaml
    fields:
      - name: updated
        label: 更新日
        type: date
        required: true
        description: 募集ボードに「◯月◯日 更新」と出ます。数字を直したら、この日付も直してください。
      - name: parts
        label: パート
        type: object
        description: 上から順にサイトに並びます。いまの人数が目標人数に届くと、自動で「募集終了」になります。
        list:
          collapsible:
            collapsed: true
            summary: "{fields.label}　{fields.current} / {fields.target}人"
        fields:
          - name: label
            label: パート名
            type: string
            required: true
          - name: note
            label: 補足
            type: string
            description: 「ピッコロもふくむ」など。なくても大丈夫です。
          - name: section
            label: グループ
            type: select
            required: true
            default: 木管楽器
            options:
              values: [木管楽器, 金管楽器, 打楽器・弦バス]
          - name: target
            label: 目標人数
            type: number
            required: true
          - name: current
            label: いまの人数
            type: number
            required: true
          - name: urgent
            label: 急募にする
            type: boolean
            default: false
            description: オンにすると「急募！」の目立つ表示になります。

  # ---------------------------------------------------------
  # サイトの基本情報（トップ・見学入団・団体紹介・フッターに出る）
  # ---------------------------------------------------------
  - name: site
    label: サイトの基本情報
    type: file
    path: _data/site.yml
    format: yaml
    fields:
      - name: practice_day
        label: 練習の曜日
        type: string
        required: true
        description: 例：毎週土曜
      - name: practice_time
        label: 練習の時間
        type: string
        required: true
        description: 例：13:00〜17:00
      - name: practice_area
        label: 練習の地域
        type: string
        required: true
        description: 見学チケットに出る短い言い方です。例：東大阪市内
      - name: practice_place
        label: 練習場所の説明
        type: text
        required: true
        description: ページのいちばん下（フッター）に出ます。
      - name: target
        label: 参加できる人
        type: string
        required: true
        description: 例：中学生から大人まで
      - name: min_age
        label: 参加できる年齢（何歳から）
        type: number
        required: true
      - name: members
        label: 団員の人数
        type: number
        required: true
        description: 「◯人以上」と出ます。
      - name: followers
        label: Instagramのフォロワー数
        type: number
        required: true
        description: 「◯人以上」と出ます。きりのいい数字がおすすめです。
      - name: fee_adult
        label: 月会費（一般）
        type: number
        required: true
        description: 円。数字だけ入れます。
      - name: fee_student
        label: 月会費（学生）
        type: number
        required: true
        description: 円。中学生・高校生の会費です。
      - name: visit_fee
        label: 見学・体験の参加費（1回）
        type: number
        required: true
        description: 円。キャンペーン中は「通常◯円」として出ます。
      - name: visit_limit
        label: 見学・体験できる回数
        type: number
        required: true
      - name: campaign
        label: 見学無料キャンペーン中
        type: boolean
        default: false
        description: オンにすると、サイト中の見学費が「0円（通常◯円）」になります。
      - name: campaign_period
        label: キャンペーンの期間
        type: string
        description: 例：2026年中（「2026年中は、見学・体験が無料です」と出ます）
      - name: email
        label: 連絡先メール
        type: string
        required: true
      - name: instagram
        label: InstagramのURL
        type: string
      - name: threads
        label: ThreadsのURL
        type: string
      - name: youtube
        label: YouTubeのURL
        type: string

  # ---------------------------------------------------------
  # 定款（rules.html に出る。章・条の番号は並び順から自動でつく）
  # ---------------------------------------------------------
  - name: rules
    label: 定款
    type: file
    path: _data/rules.yml
    format: yaml
    fields:
      - name: enforced
        label: 施行日
        type: string
        required: true
        description: 例：2026年4月1日
      - name: updated
        label: 最終改定日
        type: date
        required: true
        description: 総会などで改定したら、この日付も直してください。ページに「◯年◯月◯日 改定」と出ます。
      - name: intro
        label: はじめの一文
        type: text
      - name: chapters
        label: 章
        type: object
        description: 上から順に「第1章」「第2章」…と番号が自動でつきます。条の番号も、全部の章を通して自動でつきます（第1条、第2条…）。
        list:
          collapsible:
            collapsed: true
            summary: "{fields.title}"
        fields:
          - name: title
            label: 章の名前
            type: string
            required: true
            description: 「第◯章」は自動でつくので、名前だけ入れます。例：総則
          - name: articles
            label: 条
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{fields.title}"
            fields:
              - name: title
                label: 条の名前
                type: string
                required: true
                description: 「第◯条」は自動でつくので、名前だけ入れます。例：名称
              - name: body
                label: 本文
                type: rich-text
      - name: supplementary
        label: 附則
        type: rich-text

  # ---------------------------------------------------------
  # ルールブック（定款ページの下に出る、日常の活動ルール）
  # ---------------------------------------------------------
  - name: rulebook
    label: ルールブック
    type: file
    path: _data/rulebook.yml
    format: yaml
    fields:
      - name: updated
        label: 最終更新日
        type: date
        required: true
      - name: intro
        label: はじめの一文
        type: text
      - name: note
        label: 注意書き
        type: text
      - name: groups
        label: 項目
        type: object
        description: ページでは、項目ごとに押すと開く形で並びます。
        list:
          collapsible:
            collapsed: true
            summary: "{fields.title}"
        fields:
          - name: icon
            label: アイコン
            type: select
            default: 本
            options:
              values: [カレンダー, カメラ, 握手, 工具, 学生, 音符, 盾, 本, 吹き出し, ハート]
          - name: title
            label: 項目の名前
            type: string
            required: true
          - name: sections
            label: 小見出しと中身
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{fields.heading}"
            fields:
              - name: heading
                label: 小見出し
                type: string
              - name: body
                label: 中身
                type: rich-text
                description: 箇条書きのボタンで、1行ずつのルールにできます。
      - name: footer
        label: いちばん下の一文
        type: string
